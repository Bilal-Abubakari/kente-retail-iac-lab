[defaults]
# Inventory is generated from Terraform outputs — see inventory/generate_inventory.py
inventory            = inventory/hosts.generated.ini
roles_path           = roles
host_key_checking    = False
retry_files_enabled  = False
interpreter_python   = auto_silent
# Vault password lives OUTSIDE the repo in the operator's home (WSL ext4, 0600).
# On /mnt/c a file can't drop its exec bit, and ansible-vault would try to *run*
# an executable password file as a script — so it must live on a native FS.
vault_password_file  = ~/.kente_vault_pass
# YAML-formatted task output via the built-in default callback (the old
# community.general.yaml callback was removed in newer ansible-core).
stdout_callback         = default
callback_result_format  = yaml

[ssh_connection]
# AL2023 needs a moment after boot before sshd accepts connections; retry.
retries              = 5
pipelining           = True
