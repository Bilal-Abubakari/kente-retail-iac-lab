---
# Non-secret, staging-specific configuration. Note the values genuinely differ
# from dev (different DB host, name, user) — this is the "different config per
# environment without copy-pasting playbook logic" the spec asks for: same role,
# different group_vars.

order_service_env_name: staging
order_service_app_port: 8080 # must match the Terraform app_port for this workspace

order_service_db_host: staging-db.internal.kente.local
order_service_db_name: kente_orders_staging
order_service_db_user: kente_staging
order_service_db_password: "{{ vault_db_password }}"
